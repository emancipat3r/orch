---
- name: Orch Setup with WireGuard
  hosts: all
  become: yes
  vars:
    wireguard_port: 51820
    wireguard_interface: wg0

  pre_tasks:
    - name: Check if OS is Ubuntu or Debian
      fail:
        msg: "This playbook only supports Ubuntu and Debian distributions. Detected: {{ ansible_facts['distribution'] }}"
      when: ansible_facts['distribution'] not in ['Ubuntu', 'Debian']

    - name: Display OS information
      debug:
        msg: "Running on {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

  tasks:
    - name: Stop all apt/dpkg related systemd services and timers
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - unattended-upgrades
        - apt-daily.service
        - apt-daily.timer
        - apt-daily-upgrade.service
        - apt-daily-upgrade.timer
      ignore_errors: yes

    - name: Kill all background update processes
      # NOTE: "pkill -f <pattern>" matches against full command lines, including
      # this very shell (whose cmdline contains the pattern), so it would SIGKILL
      # itself. The [u] bracket trick makes the regex not match its own literal
      # text; every other pattern uses -x (exact process name) so we never
      # over-match.
      shell: |
        pkill -9 -f '[u]nattended-upgrade' || true
        pkill -9 -x apt-get || true
        pkill -9 -x apt || true
        pkill -9 -x dpkg || true
        pkill -9 -x aptd || true
        systemctl stop packagekit || true
        pkill -9 -x packagekitd || true
        systemctl stop snapd || true
        pkill -9 -x snapd || true
        sleep 3
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Wait for apt/dpkg locks to be released (with timeout)
      shell: |
        set -e
        MAX_WAIT=300
        WAITED=0
        echo "Checking for apt/dpkg locks..."
        while [ $WAITED -lt $MAX_WAIT ]; do
          LOCKED=0
          for lockfile in /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock; do
            if fuser "$lockfile" >/dev/null 2>&1; then
              LOCKED=1
              echo "Lock detected on $lockfile, waiting..."
              break
            fi
          done
          if [ $LOCKED -eq 0 ]; then
            echo "All locks released"
            exit 0
          fi
          sleep 5
          WAITED=$((WAITED + 5))
        done
        echo "Timeout waiting for locks, forcing removal..."
        exit 1
      args:
        executable: /bin/bash
      register: lock_wait
      changed_when: false
      failed_when: false

    - name: Force remove lock files if waiting timed out
      shell: |
        rm -f /var/lib/dpkg/lock
        rm -f /var/lib/dpkg/lock-frontend
        rm -f /var/lib/apt/lists/lock
        rm -f /var/cache/apt/archives/lock
        dpkg --configure -a || true
      args:
        executable: /bin/bash
      when: lock_wait.rc != 0
      ignore_errors: yes

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      retries: 3
      delay: 10
      register: apt_update
      until: apt_update is not failed

    - name: Install essential packages
      apt:
        name:
          - curl
          - wget
          - git
          - netcat-openbsd
          - socat
          - ufw
          - qrencode
          - net-tools
          - iptables-persistent
        state: present
      retries: 3
      delay: 10
      register: result
      until: result is not failed

    - name: Install WireGuard
      apt:
        name:
          - wireguard
          - wireguard-tools
        state: present

    - name: Enable IP forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: yes

    - name: Enable IPv6 forwarding
      sysctl:
        name: net.ipv6.conf.all.forwarding
        value: "1"
        state: present
        reload: yes

    - name: Detect primary network interface
      shell: ip route show default | awk '/default/ {print $5}' | head -n1
      register: primary_interface
      changed_when: false

    - name: Display detected primary interface
      debug:
        msg: "Primary network interface detected: {{ primary_interface.stdout }}"

    - name: Fail if no primary interface detected
      fail:
        msg: "Could not detect primary network interface"
      when: primary_interface.stdout == ""

    - name: Create WireGuard configuration directory
      file:
        path: /etc/wireguard
        state: directory
        mode: "0700"

    # Keys are persisted to files and only generated when absent, so re-running
    # this playbook (orch setup) keeps the existing tunnel identity instead of
    # rotating keys and desynchronising the already-downloaded client config.
    - name: Generate WireGuard keypairs (only if missing)
      shell: |
        set -e
        umask 077
        [ -f /etc/wireguard/{{ item }}.key ] || wg genkey > /etc/wireguard/{{ item }}.key
        wg pubkey < /etc/wireguard/{{ item }}.key > /etc/wireguard/{{ item }}.pub
      args:
        executable: /bin/bash
        creates: /etc/wireguard/{{ item }}.pub
      loop:
        - server
        - client

    - name: Read WireGuard keys
      slurp:
        src: "/etc/wireguard/{{ item }}"
      loop:
        - server.key
        - server.pub
        - client.key
        - client.pub
      register: wg_key_files
      no_log: true

    - name: Set WireGuard key facts
      set_fact:
        wg_server_private_key: "{{ (wg_key_files.results[0].content | b64decode).strip() }}"
        wg_server_public_key: "{{ (wg_key_files.results[1].content | b64decode).strip() }}"
        wg_client_private_key: "{{ (wg_key_files.results[2].content | b64decode).strip() }}"
        wg_client_public_key: "{{ (wg_key_files.results[3].content | b64decode).strip() }}"
      no_log: true

    - name: Create WireGuard server configuration
      template:
        src: ../templates/server_wg_config
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
      no_log: true
      notify: restart wireguard

    - name: Create client remote configuration directory
      file:
        path: /root/wireguard-client
        state: directory
        mode: "0700"

    - name: Create client configuration file
      ansible.builtin.template:
        src: ../templates/client_wg_config
        dest: /root/wireguard-client/client.conf
        mode: "0600"
      no_log: true

    - name: Refresh package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Disable UFW if installed
      ansible.builtin.ufw:
        state: disabled
      when: "'ufw' in ansible_facts.packages"

    # sshd takes the FIRST value it sees for each option, and Ubuntu/Debian's
    # sshd_config begins with "Include /etc/ssh/sshd_config.d/*.conf". Editing
    # the main file therefore loses to cloud-init's drop-ins; a drop-in that
    # sorts first ("00-") reliably wins.
    - name: Configure SSHD via drop-in
      copy:
        dest: /etc/ssh/sshd_config.d/00-orch.conf
        mode: "0600"
        content: |
          PasswordAuthentication no
          PubkeyAuthentication yes
          PermitRootLogin prohibit-password
          AllowTcpForwarding yes
          GatewayPorts yes
      notify: restart ssh

    - name: Validate sshd configuration
      command: /usr/sbin/sshd -t
      changed_when: false

    - name: Start and enable WireGuard
      systemd:
        name: wg-quick@wg0
        state: started
        enabled: yes

    - name: Display server public key
      debug:
        msg: "WireGuard Server Public Key: {{ wg_server_public_key }}"

  handlers:
    - name: restart wireguard
      systemd:
        name: wg-quick@wg0
        state: restarted

    - name: restart ssh
      systemd:
        name: ssh
        state: restarted
