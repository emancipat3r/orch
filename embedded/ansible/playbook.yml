---
- name: Orch Setup with WireGuard
  hosts: all
  become: yes
  vars:
    wireguard_port: 51820
    wireguard_interface: wg0

  pre_tasks:
    - name: Gather OS facts
      setup:
        gather_subset:
          - "!all"
          - "!any"
          - distribution
          - distribution_version
          - distribution_major_version

    - name: Check if OS is Ubuntu or Debian
      fail:
        msg: "This playbook only supports Ubuntu and Debian distributions. Detected: {{ ansible_distribution }}"
      when: ansible_distribution not in ['Ubuntu', 'Debian']

    - name: Display OS information
      debug:
        msg: "Running on {{ ansible_distribution }} {{ ansible_distribution_version }}"

  tasks:
    - name: Stop all apt/dpkg related systemd services and timers
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - unattended-upgrades
        - apt-daily.service
        - apt-daily.timer
        - apt-daily-upgrade.service
        - apt-daily-upgrade.timer
      ignore_errors: yes

    - name: Kill all background update processes
      shell: |
        pkill -9 -f unattended-upgrade || true
        pkill -9 apt-get || true
        pkill -9 apt || true
        pkill -9 dpkg || true
        pkill -9 aptd || true
        systemctl stop packagekit || true
        pkill -9 packagekit || true
        systemctl stop snapd || true
        pkill -9 snapd || true
        sleep 3
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Wait for apt/dpkg locks to be released (with timeout)
      shell: |
        set -e
        MAX_WAIT=300
        WAITED=0
        echo "Checking for apt/dpkg locks..."
        while [ $WAITED -lt $MAX_WAIT ]; do
          LOCKED=0
          for lockfile in /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock; do
            if fuser "$lockfile" >/dev/null 2>&1; then
              LOCKED=1
              echo "Lock detected on $lockfile, waiting..."
              break
            fi
          done
          if [ $LOCKED -eq 0 ]; then
            echo "All locks released"
            exit 0
          fi
          sleep 5
          WAITED=$((WAITED + 5))
        done
        echo "Timeout waiting for locks, forcing removal..."
        exit 1
      args:
        executable: /bin/bash
      register: lock_wait
      changed_when: false
      failed_when: false

    - name: Force remove lock files if waiting timed out
      shell: |
        rm -f /var/lib/dpkg/lock
        rm -f /var/lib/dpkg/lock-frontend
        rm -f /var/lib/apt/lists/lock
        rm -f /var/cache/apt/archives/lock
        dpkg --configure -a || true
      args:
        executable: /bin/bash
      when: lock_wait.rc != 0
      ignore_errors: yes

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      retries: 3
      delay: 10
      register: apt_update
      until: apt_update is not failed

    - name: Install essential packages
      apt:
        name:
          - curl
          - wget
          - git
          - netcat-openbsd
          - socat
          - ufw
          - qrencode
          - net-tools
          - iptables-persistent
        state: present
      retries: 3
      delay: 10
      register: result
      until: result is not failed

    - name: Install WireGuard
      apt:
        name:
          - wireguard
          - wireguard-tools
        state: present

    - name: Enable IP forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: yes

    - name: Enable IPv6 forwarding
      sysctl:
        name: net.ipv6.conf.all.forwarding
        value: "1"
        state: present
        reload: yes

    - name: Detect primary network interface
      shell: ip route show default | awk '/default/ {print $5}' | head -n1
      register: primary_interface
      changed_when: false

    - name: Display detected primary interface
      debug:
        msg: "Primary network interface detected: {{ primary_interface.stdout }}"

    - name: Fail if no primary interface detected
      fail:
        msg: "Could not detect primary network interface"
      when: primary_interface.stdout == ""

    - name: Generate WireGuard server private key
      shell: wg genkey
      register: wg_server_private_key
      changed_when: false
      no_log: true

    - name: Generate WireGuard server public key
      shell: echo "{{ wg_server_private_key.stdout }}" | wg pubkey
      register: wg_server_public_key
      changed_when: false

    - name: Generate WireGuard client private key
      shell: wg genkey
      register: wg_client_private_key
      changed_when: false
      no_log: true

    - name: Generate WireGuard client public key
      shell: echo "{{ wg_client_private_key.stdout }}" | wg pubkey
      register: wg_client_public_key
      changed_when: false

    - name: Create WireGuard configuration directory
      file:
        path: /etc/wireguard
        state: directory
        mode: "0700"

    - name: Create WireGuard server configuration
      template:
        src: ../templates/server_wg_config
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
      notify: restart wireguard

    - name: Create client remote configuration directory
      file:
        path: /root/wireguard-client
        state: directory
        mode: "0700"

    - name: Create client configuration file
      ansible.builtin.template:
        src: ../templates/client_wg_config
        dest: /root/wireguard-client/client.conf
        mode: "0600"

    - name: Refresh package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Disable UFW if installed
      ansible.builtin.ufw:
        state: disabled
      when: "'ufw' in ansible_facts.packages"

    - name: Configure SSHD
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        validate: "/usr/sbin/sshd -t -f %s"
      loop:
        - {
            regexp: "^.PasswordAuthentication.*",
            line: "PasswordAuthentication no",
          }
        - { regexp: "^.AllowTcpForwarding.*", line: "AllowTcpForwarding yes" }
        - { regexp: "^.GatewayPorts.*", line: "GatewayPorts yes" }
        - {
            regexp: "^.PubkeyAuthentication.*",
            line: "PubkeyAuthentication yes",
          }
        - {
            regexp: "^.PermitRootLogin.*",
            line: "PermitRootLogin prohibit-password",
          }
      notify: restart ssh

    - name: Start and enable WireGuard
      systemd:
        name: wg-quick@wg0
        state: started
        enabled: yes

    - name: Display server public key
      debug:
        msg: "WireGuard Server Public Key: {{ wg_server_public_key.stdout }}"

    - name: Create Ansible facts directory
      file:
        path: /etc/ansible/facts.d
        state: directory
        mode: "0755"

    - name: Save WireGuard keys to local facts
      copy:
        content: |
          {
            "server_private_key": "{{ wg_server_private_key.stdout }}",
            "server_public_key": "{{ wg_server_public_key.stdout }}",
            "client_private_key": "{{ wg_client_private_key.stdout }}",
            "client_public_key": "{{ wg_client_public_key.stdout }}"
          }
        dest: /etc/ansible/facts.d/wireguard.fact
        mode: "0600"

  handlers:
    - name: restart wireguard
      systemd:
        name: wg-quick@wg0
        state: restarted

    - name: restart ssh
      systemd:
        name: ssh
        state: restarted
